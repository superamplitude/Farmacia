name: Deploy Farmacia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmacia-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, farmacia, production]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare VPS bridge best effort
        run: |
          if sudo -n /usr/local/sbin/farmacia-vps-control prepare; then
            echo "VPS_BRIDGE=ready"
          else
            echo "VPS_BRIDGE=helper_reported_failure"
          fi
          if sudo -n /usr/local/sbin/farmacia-vps-control repair-php-vhost; then
            echo "VPS_VHOST=php-fpm"
          else
            echo "VPS_VHOST=repair_not_available_yet"
          fi

      - name: Establish canonical runner layout
        run: |
          set -Eeuo pipefail
          LAYOUT="$RUNNER_TEMP/farmacia-layout.env"
          cat > "$LAYOUT" <<'EOF'
          APP_USER=superamplitude-farmacia
          APP_HOME=/home/superamplitude-farmacia
          APP_DIR=/home/superamplitude-farmacia/htdocs/farmacia.superamplitude.com
          STATE_DIR=/home/superamplitude-farmacia/.farmacia
          VHOST_FILE=/etc/nginx/sites-enabled/farmacia.superamplitude.com.conf
          EOF
          chmod 600 "$LAYOUT"
          echo "FARMACIA_LAYOUT_FILE=$LAYOUT" >> "$GITHUB_ENV"
          echo "RUNNER_LAYOUT=$LAYOUT"

      - name: Validate direct runner access
        run: |
          set -Eeuo pipefail
          APP_DIR=/home/superamplitude-farmacia/htdocs/farmacia.superamplitude.com
          STATE_DIR=/home/superamplitude-farmacia/.farmacia
          id
          cd "$APP_DIR"
          PROBE="$APP_DIR/.farmrunner-ci-probe-$$"
          : > "$PROBE"
          rm -f "$PROBE"
          cd "$STATE_DIR"
          PROBE_STATE="$STATE_DIR/.farmrunner-ci-probe-$$"
          : > "$PROBE_STATE"
          rm -f "$PROBE_STATE"
          echo "DIRECT_RUNNER_ACCESS=OK"

      - name: Diagnose environment
        run: bash deploy/preflight.sh report

      - name: Enforce production preflight
        run: bash deploy/preflight.sh strict

      - name: Deploy production
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: bash deploy/bootstrap-v2.sh

      - name: Verify production and collect evidence
        if: always()
        run: bash deploy/verify.sh

      - name: Collect root diagnostics on failure
        if: failure()
        run: sudo -n /usr/local/sbin/farmacia-vps-control diagnose || true
