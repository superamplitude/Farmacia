name: Deploy Farmacia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmacia-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, farmacia, production]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare VPS bridge best effort
        run: |
          if sudo -n /usr/local/sbin/farmacia-vps-control prepare; then
            echo "VPS_BRIDGE=ready"
          else
            echo "VPS_BRIDGE=helper_reported_failure"
            echo "Continuing with direct runner access validation because permissions/layout may already have been applied."
          fi

      - name: Validate direct runner access
        run: |
          set -Eeuo pipefail
          test -r /etc/farmacia-superamplitude/layout.env
          source /etc/farmacia-superamplitude/layout.env
          test "$APP_USER" = "superamplitude-farmacia"
          test "$APP_DIR" = "/home/superamplitude-farmacia/htdocs/farmacia.superamplitude.com"
          test "$STATE_DIR" = "/home/superamplitude-farmacia/.farmacia"
          cd "$APP_DIR"
          PROBE="$APP_DIR/.farmrunner-ci-probe-$$"
          : > "$PROBE"
          rm -f "$PROBE"
          cd "$STATE_DIR"
          PROBE_STATE="$STATE_DIR/.farmrunner-ci-probe-$$"
          : > "$PROBE_STATE"
          rm -f "$PROBE_STATE"
          echo "DIRECT_RUNNER_ACCESS=OK"

      - name: Diagnose environment
        run: bash deploy/preflight.sh report

      - name: Enforce production preflight
        run: bash deploy/preflight.sh strict

      - name: Deploy production
        run: bash deploy/bootstrap-v2.sh

      - name: Verify production and collect evidence
        if: always()
        run: bash deploy/verify.sh

      - name: Collect root diagnostics on failure
        if: failure()
        run: sudo -n /usr/local/sbin/farmacia-vps-control diagnose || true
